          "options": {
            "format": "html",
            "media": "uploads",
            "switcher": false
          }
        },
        {
          "name": "author",
          "label": "Author (optional)",
          "type": "string",
          "required": false
        },
        {
          "name": "tags",
          "label": "Tags (optional)",
          "type": "string",
          "required": false,
          "list": true
        },
        {
          "name": "last_updated",
          "label": "Last updated date (optional)",
