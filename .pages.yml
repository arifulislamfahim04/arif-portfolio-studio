{
  "media": [
    {
      "name": "uploads",
      "label": "Pictures, résumé & certificates",
      "input": "docs/assets",
      "output": "assets",
      "rename": "safe",
      "extensions": [
        "jpg",
        "jpeg",
        "png",
        "webp",
        "gif",
        "pdf",
        "mp4",
        "webm"
      ]
    },
    {
      "name": "icons",
      "label": "SVG icons (SVG Repo)",
      "input": "docs/assets/icons",
      "output": "assets/icons",
      "rename": "safe",
      "extensions": [
        "svg"
      ]
    },
    {
      "name": "institution_logos",
      "label": "Institution logos (SVG or pictures)",
      "input": "docs/assets/institutions",
      "output": "assets/institutions",
      "rename": "safe",
      "extensions": [
        "svg",
        "png",
        "jpg",
        "jpeg",
        "webp"
      ]
    }
  ],
  "content": [
    {
      "name": "profile",
      "label": "Profile, résumé & homepage",
      "type": "file",
      "path": "editor/profile.json",
      "format": "json",
      "fields": [
        {
          "name": "name",
          "label": "Full name (also on ID card)",
          "type": "string",
          "required": true,
          "description": "Your name appears on the ID card and across the site."
        },
        {
          "name": "role",
          "label": "Professional title",
          "type": "string"
        },
        {
          "name": "location",
          "label": "Location",
          "type": "string"
        },
        {
          "name": "availability",
          "label": "Availability",
          "type": "string"
        },
        {
          "name": "email",
          "label": "Email / ID card Mail button",
          "type": "string",
          "required": true,
          "description": "Your real email address. The Mail icon opens a new email to this address."
        },
        {
          "name": "phone",
          "label": "Phone number",
          "type": "string"
        },
        {
          "name": "linkedin",
          "label": "LinkedIn / ID card link",
          "type": "string",
          "description": "Paste your full LinkedIn profile URL. Opens in a new tab."
        },
        {
          "name": "photo",
          "label": "Portrait / ID card photo",
          "type": "image",
          "options": {
            "media": "uploads"
          },
          "description": "Upload or replace your portrait here. The ID card crops it to an upright portrait."
        },
        {
          "name": "photo_alt",
          "label": "Describe your portrait",
          "type": "string"
        },
        {
          "name": "cover",
          "label": "Homepage background image",
          "type": "image",
          "options": {
            "media": "uploads"
          }
        },
        {
          "name": "secondary_image",
          "label": "Secondary textile image",
          "type": "image",
          "options": {
            "media": "uploads"
          }
        },
        {
          "name": "resume",
          "label": "Résumé PDF",
          "type": "file",
          "options": {
            "media": "uploads",
            "extensions": [
              "pdf",
              "jpg",
              "jpeg",
              "png",
              "webp"
            ]
          }
        },
        {
          "name": "introduction",
          "label": "Homepage about paragraph",
          "type": "rich-text",
          "options": {
            "format": "html",
            "media": "uploads",
            "switcher": false
          }
        },
        {
          "name": "call_to_action",
          "label": "Opportunity / availability paragraph",
          "type": "rich-text",
          "options": {
            "format": "html",
            "media": "uploads",
            "switcher": false
          }
        },
        {
          "name": "stats",
          "label": "Homepage statistics",
          "type": "object",
          "list": true,
          "fields": [
            {
              "name": "value",
              "label": "Number",
              "type": "string"
            },
            {
              "name": "decimals",
              "label": "Decimal places",
              "type": "number"
            },
            {
              "name": "suffix",
              "label": "Suffix, e.g. + or /4.00",
              "type": "string"
            },
            {
              "name": "label",
              "label": "Label",
              "type": "string"
            },
            {
              "name": "detail",
              "label": "Detail",
              "type": "string"
            },
            {
              "name": "icon",
              "label": "Filled statistic icon (optional)",
              "type": "select",
              "options": [
                "home",
                "about",
                "blogs",
                "projects",
                "contact",
                "sun",
                "moon",
                "menu",
                "close",
                "arrow",
                "up",
                "down",
                "left",
                "right",
                "download",
                "linkedin",
                "facebook",
                "youtube",
                "x",
                "phone",
                "location",
                "award",
                "users",
                "book",
                "research",
                "copy",
                "check",
                "tag",
                "message",
                "quote",
                "fabric",
                "focus",
                "globe",
                "language",
                "search",
                "certificate",
                "zoom",
                "minus",
                "clock",
                "gallery",
                "whatsapp"
              ]
            }
          ]
        },
        {
          "name": "social_links",
          "label": "Other social / professional links (optional)",
          "type": "object",
          "required": false,
          "list": true,
          "fields": [
            {
              "name": "label",
              "label": "Link text (optional)",
              "type": "string",
              "required": false
            },
            {
              "name": "url",
              "label": "URL (optional)",
              "type": "string",
              "required": false
            }
          ]
        },
        {
          "name": "facebook",
          "label": "Facebook / ID card link (optional)",
          "type": "string",
          "description": "Paste your full Facebook profile URL. Leave empty to hide the Facebook icon."
        }
      ]
    },
    {
