{
  "media": [
    {
      "name": "uploads",
      "label": "Pictures, résumé & certificates",
      "input": "docs/assets",
      "output": "assets",
      "rename": "safe",
      "extensions": [
        "jpg",
        "jpeg",
        "png",
        "webp",
        "gif",
        "pdf",
        "mp4",
        "webm"
      ]
    }
  ],
  "content": [
    {
      "name": "profile",
      "label": "Profile, résumé & homepage",
      "type": "file",
      "path": "editor/profile.json",
      "format": "json",
      "fields": [
        {
          "name": "name",
          "label": "Your full name",
          "type": "string",
          "required": true
        },
        {
          "name": "role",
          "label": "Professional title",
          "type": "string"
        },
        {
          "name": "location",
          "label": "Location",
          "type": "string"
        },
        {
          "name": "availability",
          "label": "Availability",
          "type": "string"
        },
        {
          "name": "email",
          "label": "Email",
          "type": "string",
          "required": true
        },
        {
          "name": "phone",
          "label": "Phone number",
          "type": "string"
        },
        {
          "name": "linkedin",
          "label": "LinkedIn URL",
          "type": "string"
        },
        {
          "name": "photo",
          "label": "Profile portrait (leave empty for original design)",
          "type": "image",
          "options": {
            "media": "uploads"
          }
        },
        {
          "name": "photo_alt",
          "label": "Describe your portrait",
          "type": "string"
        },
        {
          "name": "cover",
          "label": "Homepage background image",
          "type": "image",
          "options": {
            "media": "uploads"
          }
        },
        {
          "name": "secondary_image",
          "label": "Secondary textile image",
          "type": "image",
          "options": {
            "media": "uploads"
          }
        },
        {
          "name": "resume",
          "label": "Résumé PDF",
          "type": "file",
          "options": {
            "media": "uploads",
            "extensions": [
              "pdf",
              "jpg",
              "jpeg",
              "png",
              "webp"
            ]
          }
        },
        {
          "name": "hero_title",
          "label": "Homepage headline",
          "type": "string"
        },
        {
          "name": "rotating_words",
          "label": "Rotating headline phrases",
          "type": "string",
          "list": true
        },
        {
          "name": "hero_description",
          "label": "Short introduction",
          "type": "rich-text",
          "options": {
            "format": "html",
            "media": "uploads",
            "switcher": false
          }
        },
        {
          "name": "introduction",
          "label": "Homepage about paragraph",
          "type": "rich-text",
          "options": {
            "format": "html",
            "media": "uploads",
            "switcher": false
          }
        },
        {
          "name": "call_to_action",
          "label": "Opportunity / availability paragraph",
          "type": "rich-text",
          "options": {
            "format": "html",
            "media": "uploads",
            "switcher": false
          }
        },
        {
          "name": "stats",
          "label": "Homepage statistics",
          "type": "object",
          "list": true,
          "fields": [
            {
              "name": "value",
              "label": "Number",
              "type": "string"
            },
            {
              "name": "decimals",
              "label": "Decimal places",
              "type": "number"
            },
            {
              "name": "suffix",
              "label": "Suffix, e.g. + or /4.00",
              "type": "string"
            },
            {
              "name": "label",
              "label": "Label",
              "type": "string"
            },
            {
              "name": "detail",
              "label": "Detail",
              "type": "string"
            }
          ]
        }
      ]
    },
