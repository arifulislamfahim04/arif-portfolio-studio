        {
          "name": "category",
          "label": "Category",
          "type": "string",
          "default": "General"
        },
        {
          "name": "label",
          "label": "Short label / status",
          "type": "string"
        },
        {
          "name": "summary",
          "label": "Card summary",
          "type": "text"
        },
        {
          "name": "cover",
          "label": "Cover image",
