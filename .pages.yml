          "options": {
            "media": "uploads"
          }
        },
        {
          "name": "cover_alt",
          "label": "Describe the cover image",
          "type": "string"
        },
        {
          "name": "body",
          "label": "Write your article or project here",
          "type": "rich-text",
          "options": {
            "format": "html",
            "media": "uploads",
            "switcher": false
          }
        },
        {
          "name": "gallery",
          "label": "Extra pictures with captions",
