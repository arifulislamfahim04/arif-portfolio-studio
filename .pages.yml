    {
      "name": "posts",
      "label": "Blogs & articles",
      "type": "collection",
      "path": "editor/posts",
      "format": "json",
      "filename": "{primary}.json",
      "subfolders": false,
      "view": {
        "primary": "title",
        "fields": [
          "title",
          "date",
          "published",
          "order"
        ],
        "sort": "order",
        "order": "asc"
      },
      "fields": [
        {
          "name": "title",
          "label": "Title",
          "type": "string",
          "required": true
        },
        {
          "name": "date",
          "label": "Date / period (e.g. 2026–2028)",
          "type": "string"
        },
        {
          "name": "category",
          "label": "Category",
          "type": "string",
          "default": "General"
        },
        {
          "name": "label",
          "label": "Short label / status",
          "type": "string"
        },
        {
          "name": "summary",
          "label": "Card summary",
          "type": "text"
        },
        {
          "name": "cover",
          "label": "Cover image",
          "type": "image",
          "options": {
            "media": "uploads"
          }
        },
        {
          "name": "cover_alt",
          "label": "Describe the cover image",
          "type": "string"
        },
        {
          "name": "body",
          "label": "Write your article or project here",
